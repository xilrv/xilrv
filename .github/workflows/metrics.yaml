name: Metrics

on:
  # schedule: [{cron: "0 0/24 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: left profile 
        uses: gh-metrics/metrics@master # stalomeow/metrics@projects-v2
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/metrics.left.svg

          # Options
          user: xilrv
          template: classic
          base: header, activity, community
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_languages: yes
          plugin_languages_analysis_timeout: 40
          plugin_languages_analysis_timeout_repositories: 10
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, 4D, q, makefile, m4, batchfile, jupyter notebook, tex, shell
          # plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_recent_days: 140
          plugin_languages_recent_load: 1000
          plugin_languages_sections: most-used # recently-used
          commits_authoring: xilrv
          config_order: base.header, base.activity+community, isocalendar, followup, languages

      - name: right profile 
        uses: gh-metrics/metrics@master # stalomeow/metrics@projects-v2
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/metrics.right.svg

          # Options
          user: xilrv
          template: classic
          base: ""
          config_padding: 0, 0
          config_timezone: Asia/Tokyo
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 13
          plugin_achievements_threshold: X
